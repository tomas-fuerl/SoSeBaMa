name: Security-debt tracking

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 * * * *'
    - cron: '43 1 * * *'
  workflow_dispatch:

concurrency:
  group: security-debt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: dependency findings
    if: github.event_name != 'schedule' || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      security-events: read
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.18.0 --activate
      - name: Collect pnpm audit report
        shell: bash
        run: |
          set +e
          pnpm audit --json > pnpm-audit.json
          audit_status=$?
          set -e
          if (( audit_status > 1 )); then
            exit "$audit_status"
          fi
      - name: Collect Trivy dependency report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-fs.json
          exit-code: '0'
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
      - name: Synchronize dependency Security-Debt issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SCAN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SYNC_MODE: ${{ vars.SECURITY_DEBT_APPLY == 'true' && '--apply' || '' }}
        run: |
          sync_args=()
          if [[ -n "$SYNC_MODE" ]]; then
            sync_args+=("$SYNC_MODE")
          fi
          node tools/sync-security-debt.mjs "${sync_args[@]}" \
            --dependabot \
            --pnpm-audit=pnpm-audit.json \
            --trivy=trivy-fs.json::pnpm-lock.yaml::trivy-fs \
            "--repository=$REPOSITORY" \
            "--scan-url=$SCAN_URL"

  images:
    name: image findings
    if: github.event_name != 'schedule' || github.event.schedule == '43 1 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      SOSEBAMA_DEV_GATEWAY_PORT: '18080'
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.18.0 --activate
      - name: Build DEV application images
        run: pnpm container:build
      - name: Build sanitized browser image
        id: browser-image
        run: |
          pnpm browser:build
          printf 'id=%s\n' "$(docker image inspect sosebama-browser:dev --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - name: Collect backend image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: sosebama-backend:dev
          scanners: vuln
          format: json
          output: trivy-backend.json
          exit-code: '0'
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
      - name: Collect web image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          version: v0.74.0
          scan-type: image
          image-ref: sosebama-web:dev
          scanners: vuln
          format: json
          output: trivy-web.json
          exit-code: '0'
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
      - name: Collect browser image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          version: v0.74.0
          scan-type: image
          image-ref: ${{ steps.browser-image.outputs.id }}
          scanners: vuln
          format: json
          output: trivy-browser.json
          exit-code: '0'
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
      - name: Synchronize image Security-Debt issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SCAN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SYNC_MODE: ${{ vars.SECURITY_DEBT_APPLY == 'true' && '--apply' || '' }}
        run: |
          sync_args=()
          if [[ -n "$SYNC_MODE" ]]; then
            sync_args+=("$SYNC_MODE")
          fi
          node tools/sync-security-debt.mjs "${sync_args[@]}" \
            --trivy=trivy-backend.json::containers/backend.Dockerfile::trivy-image-backend \
            --trivy=trivy-web.json::containers/web.Dockerfile::trivy-image-web \
            --trivy=trivy-browser.json::containers/browser.Dockerfile::trivy-image-browser \
            "--repository=$REPOSITORY" \
            "--scan-url=$SCAN_URL"
