name: Repository quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository:
    name: repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.18.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --strict-peer-dependencies
      - name: Run repository checks
        run: pnpm check

  containers:
    name: containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOSEBAMA_DEV_GATEWAY_PORT: '18080'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.18.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --strict-peer-dependencies
      - name: Validate DEV Compose configuration
        run: pnpm container:config
      - name: Check DEV container policy
        run: pnpm container:policy
      - name: Build DEV container images
        run: pnpm container:build
      # Die Scans laufen vor dem Start: geprueft wird das gerade gebaute
      # Artefakt, bevor es verwendet wird. Die Trivy-Version ist wie jede andere
      # Abhaengigkeit fixiert; die Ausnahmen stehen in .trivyignore.yaml.
      #
      # Die Image-Scans verwenden `ignore-unfixed: true`, der Abhaengigkeitsscan
      # bewusst nicht. Begruendung und Eigentuemerentscheidung stehen in
      # docs/development/SUPPLY-CHAIN-CHECKS.md. Kurz: Ein Debian-Befund ohne
      # Fix bietet keine Handlungsoption ausser einer Ausnahme; ein dauerhaft
      # roter Job wird abgeschaltet statt beachtet. Der nachfolgende
      # Sichtbarkeitsscan haelt diese Befunde trotzdem im Log.
      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: sosebama-backend:dev
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
      - name: Scan web image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          version: v0.74.0
          scan-type: image
          image-ref: sosebama-web:dev
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
      - name: Scan resolved dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
      - name: Scan Dockerfiles and Compose for misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          version: v0.74.0
          scan-type: config
          scan-ref: .
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
      # Bewusst nicht blockierend: Diese Befunde haben keinen Fix und koennen
      # nicht behoben werden. Sie bleiben aber sichtbar, damit die Entscheidung
      # ueber `ignore-unfixed` nicht dazu fuehrt, dass niemand sie mehr kennt.
      - name: Report unfixed backend image findings without blocking
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          version: v0.74.0
          scan-type: image
          image-ref: sosebama-backend:dev
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
      - name: Report unfixed web image findings without blocking
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          version: v0.74.0
          scan-type: image
          image-ref: sosebama-web:dev
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
      - name: Start and health-check DEV containers
        run: pnpm container:up
      - name: Verify DEV container health
        run: pnpm container:health
      - name: Verify DEV host ingress
        run: pnpm container:smoke
      # Bewusst nicht blockierend, und das ist eine Eigentuemerentscheidung.
      # Das Playwright-Image ist ein reines Testartefakt: Es wird nie
      # ausgeliefert, laeuft unprivilegiert im internen Netz ohne Route nach
      # aussen und laedt ausschliesslich lokal erzeugte Inhalte. Die Befunde
      # liegen im gebuendelten npm des Images -- derselbe Fall wie beim
      # Node-Basisimage, dort aber entfernbar, hier nicht: Nur der Hersteller
      # kann das Image neu bauen. Ein blockierendes Gate waere dauerhaft rot
      # und wuerde abgeschaltet statt beachtet. Begruendung und Stand:
      # docs/development/SUPPLY-CHAIN-CHECKS.md
      - name: Report browser image findings without blocking
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          version: v0.74.0
          scan-type: image
          image-ref: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
      - name: Verify SPA delivery in Chromium
        run: pnpm browser:smoke
      - name: Verify DEV structured logs
        run: pnpm container:logs
      # Ohne diesen Schritt ist eine fehlgeschlagene Rolle nur als Exit-Code
      # sichtbar; der eigentliche Startfehler bleibt im Container verborgen.
      - name: Show DEV container state and logs on failure
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml ps --all
          docker compose -f compose.yaml -f compose.dev.yaml logs --no-color --tail 200
      - name: Stop DEV containers
        if: always()
        run: pnpm container:down
      - name: Verify DEV cleanup
        if: always()
        run: pnpm container:cleanup

  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dependency Review vergleicht Basis und Head und ist deshalb nur fuer
      # Pull Requests definiert. Auf push nach main entfaellt der Schritt.
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: false

  # CodeQL prueft nach ADR-0013 TypeScript/JavaScript und GitHub Actions. Der
  # Job braucht als einziger erweiterte Rechte, um Ergebnisse als SARIF in die
  # Code-Scanning-Ansicht zu schreiben; alle uebrigen Jobs bleiben bei
  # `contents: read` aus der Workflowvorgabe.
  code-scanning:
    name: code-scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          languages: ${{ matrix.language }}
      - name: Analyse with CodeQL
        uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          category: /language:${{ matrix.language }}

  # Zusammenfassender Pflichtstatus nach ADR-0013. Der Kontextname `quality`
  # bleibt unveraendert, damit das bestehende Branch-Ruleset weiter greift.
  # `if: always()` stellt sicher, dass der Job auch dann laeuft und fehlschlaegt,
  # wenn ein benoetigter Job abgebrochen wurde oder gescheitert ist.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - repository
      - containers
      - dependencies
      - code-scanning
    if: always()
    steps:
      - name: Verify that every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              const results = JSON.parse(raw);
              const failed = Object.entries(results)
                .filter(([, value]) => value.result !== "success")
                .map(([name, value]) => `${name}: ${value.result}`);
              if (failed.length > 0) {
                console.error(`Required jobs did not succeed:\n${failed.join("\n")}`);
                process.exit(1);
              }
              console.log("All required jobs succeeded.");
            });
          '
