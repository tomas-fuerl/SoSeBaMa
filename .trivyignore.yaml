# Befristete, dokumentierte Ausnahmen für Trivy nach ADR-0013.
#
# Ein Befund wird zuerst behoben; eine Ausnahme ist die Rückfallposition, nicht
# der Regelfall. Das Verfahren steht in docs/development/SUPPLY-CHAIN-CHECKS.md.
#
# Jeder Eintrag benötigt:
#   id          die Kennung des Befunds
#   statement   Begründung, Einbindungsart und geprüfte Alternativen
#   expired_at  Ablaufdatum; danach schlägt der Befund wieder fehl
#
# `expired_at` ist keine Formalie: Trivy lässt die Ausnahme danach automatisch
# verfallen, sodass eine vergessene Ausnahme sichtbar wird, statt dauerhaft zu
# gelten. Ein Eintrag ohne Ablaufdatum ist nach dieser Richtlinie unzulässig.

vulnerabilities:
  # Go-Standardbibliothek und Go-Module im vorkompilierten Caddy-Binary.
  #
  # Caddy 2.11.4 ist die neueste veröffentlichte Version; ein Versionssprung
  # steht nicht zur Verfügung. Das offizielle Image wurde seit dem ursprünglichen
  # Pin neu gebaut, jedoch nachweislich mit derselben Go-Toolchain: Nach dem
  # Digestwechsel meldet Trivy unverändert `stdlib v1.26.3`, `x/net v0.55.0`
  # und `x/text v0.37.0`.
  #
  # Das Binary wird als offizielles Image übernommen und nicht selbst gebaut.
  # Die einzige Abhilfe ist ein Upstream-Release, das gegen eine neuere
  # Go-Version gebaut wurde. Dependabot überwacht das Docker-Ökosystem und meldet
  # einen solchen Rebuild.
  #
  # Bewertung: Caddy ist der einzige Anwendungseingang, die Befunde sind daher
  # nicht folgenlos. Sie sind sämtlich als Denial of Service eingestuft, keiner
  # als kritisch. Für DEV besteht kein Zugriff von außerhalb des Loopback. Vor
  # einer TST- oder PRD-Freigabe ist diese Ausnahme neu zu bewerten und nicht
  # ungeprüft zu verlängern.
  - id: CVE-2026-27145
    paths:
      - usr/bin/caddy
    statement: >-
      crypto/x509 in der Go-Standardbibliothek des Caddy-Binarys. Nur durch ein Upstream-Release mit
      neuerer Go-Version behebbar.
    expired_at: 2026-11-16
  - id: CVE-2026-33818
    paths:
      - usr/bin/caddy
    statement: >-
