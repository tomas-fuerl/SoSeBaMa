packages:
  - apps/*
  - packages/*

# Sicherheitsbedingte Auflösung einer transitiven Abhängigkeit.
# nanoid < 3.3.17 ist über GHSA-2v37-7h3g-55p8 (CVE-2026-67213) verwundbar und
# wird ausschließlich transitiv über postcss aus der Buildkette von Vite und
# Vitest gezogen. postcss erlaubt bereits ^3.3.16; das Override hebt lediglich
# die im Lockfile festgeschriebene Auflösung auf die gepatchte Version.
# Entfernen, sobald postcss die gepatchte Version selbst mitbringt.
overrides:
  nanoid@<3.3.17: '3.3.17'
